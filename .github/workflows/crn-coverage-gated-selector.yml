name: CRN coverage-gated selection qualification

on:
  pull_request:
    branches: [research/joint-event-coupling-portfolio-v0.1]
    paths:
      - 'Cargo.toml'
      - 'examples/event_rng_crn_coverage_gate.rs'
      - 'docs/research/CRN_COVERAGE_GATED_SELECTOR_V0_1.md'
      - 'docs/research/contracts/crn-coverage-gate.v0.1.json'
      - '.github/workflows/crn-coverage-gated-selector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Rust ${{ matrix.toolchain }} — coverage-gated CRN selector
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.99.1', '1.100.0', '1.101.0-beta.1']
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install exact toolchain and rustfmt
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt
          rustc "+$TOOLCHAIN" -vV
          cargo "+$TOOLCHAIN" -Vv
          rustc "+$TOOLCHAIN" --version | grep -F "rustc $TOOLCHAIN"

      - name: Check benchmark formatting
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustfmt "+$TOOLCHAIN" --check examples/event_rng_crn_coverage_gate.rs

      - name: Run selector and inference unit tests
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo "+$TOOLCHAIN" test --locked --example event_rng_crn_coverage_gate

      - name: Execute disjoint training and holdout coverage benchmark
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          set -euo pipefail
          cargo "+$TOOLCHAIN" run --locked --release --example event_rng_crn_coverage_gate | tee "$RUNNER_TEMP/coverage-gate.txt"

      - name: Validate receipts against the frozen coverage contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schema == "luminous.symtropy.crn-coverage-gate.v0.1" and .train_studies == 5000 and .holdout_studies == 5000 and .observations_per_study == 200 and .selector.coverage_floor == 0.93' docs/research/contracts/crn-coverage-gate.v0.1.json
          python3 - "$RUNNER_TEMP/coverage-gate.txt" <<'PY'
          import json
          import pathlib
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          records = [json.loads(line.split('=', 1)[1]) for line in lines if line.startswith('COVERAGE_GATE_JSON=')]
          selections = [json.loads(line.split('=', 1)[1]) for line in lines if line.startswith('COVERAGE_GATE_SELECTION_JSON=')]
          assert len(records) == 10, f'expected 10 partition/policy records, got {len(records)}'
          assert len(selections) == 1, f'expected one selection receipt, got {len(selections)}'
          by_key = {(r['partition'], r['policy']): r for r in records}
          assert len(by_key) == 10, 'duplicate or missing partition/policy receipt'
          assert {r['partition'] for r in records} == {'training', 'holdout'}
          assert all(r['studies'] == 5000 and r['observations_per_study'] == 200 for r in records)
          selected = selections[0]
          assert selected['variance_only_choice'] == 'cyclic_shift_eps_0_01', selected
          assert selected['coverage_gated_choice'] == 'cyclic_shift_eps_0_25', selected
          assert selected['coverage_floor'] == 0.93
          assert selected['variance_only_holdout_wilson_95'][1] < 0.93, selected
          assert selected['gated_holdout_wilson_95'][0] > 0.93, selected
          assert selected['gated_holdout_variance_ratio'] < 0.8, selected
          for partition in ('training', 'holdout'):
              for record in (r for r in records if r['partition'] == partition):
                  lo, hi = record['coverage_wilson_95']
                  assert 0.0 <= lo <= record['coverage'] <= hi <= 1.0, record
          assert 'benchmark_status=PASS' in lines
          print('PASS: coverage-gated selector receipts satisfy the disjoint-holdout contract')
          PY

      - name: Enforce lockfile immutability
        run: git diff --exit-code -- Cargo.lock
