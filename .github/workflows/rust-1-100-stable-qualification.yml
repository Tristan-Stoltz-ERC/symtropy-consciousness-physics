name: Rust stable and forward-compatibility qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-toolchain-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-artifact-passport-self-test:
    name: Cargo artifact passport integrity and tamper controls
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse contract and check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schema == "luminous.cargo-artifact-passport.v0.1"' benchmarks/rust-toolchain/cargo-artifact-passport-v0.1.json
          jq -e '.schema == "luminous.rust-toolchain-benchmark-program.v0.1"' benchmarks/rust-toolchain/benchmark-program-v0.1.json
          bash -n scripts/capture-cargo-artifacts.sh
          bash -n scripts/verify-cargo-artifact-passport.sh
          bash -n scripts/test-cargo-artifact-passport.sh
      - name: Run artifact mutation and provenance negative controls
        run: bash scripts/test-cargo-artifact-passport.sh

  rust-1-100-stable:
    name: Rust 1.100.0 stable library qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install and identify exact Rust 1.100.0 stable
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          RUSTC_VERSION="$(rustup run 1.100.0 rustc --version)"
          CARGO_VERSION="$(rustup run 1.100.0 cargo --version)"
          [[ "$RUSTC_VERSION" == "rustc 1.100.0 "* ]]
          [[ "$CARGO_VERSION" == "cargo 1.100.0 "* ]]
          rustup run 1.100.0 rustc -Vv | tee rustc-version.txt
          rustup run 1.100.0 cargo -Vv | tee cargo-version.txt
          {
            echo "## Exact stable toolchain"
            echo
            echo "- $RUSTC_VERSION"
            echo "- $CARGO_VERSION"
            echo "- source commit $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve exact locked dependency graph under 14-day cooldown
        env:
          CARGO_REGISTRY_GLOBAL_MIN_PUBLISH_AGE: 14 days
          CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE: deny
        run: cargo +1.100.0 fetch --locked --config config/cargo-1.100-canary.toml

      - name: Parse workspace metadata without modifying dependencies
        run: cargo +1.100.0 metadata --locked --format-version 1 --no-deps --config config/cargo-1.100-canary.toml > /dev/null

      - name: Check supported library target
        run: cargo +1.100.0 check --locked --lib --config config/cargo-1.100-canary.toml

      - name: Run supported library tests
        run: cargo +1.100.0 test --locked --lib --config config/cargo-1.100-canary.toml

      - name: Run Clippy on supported library target
        run: cargo +1.100.0 clippy --locked --lib --config config/cargo-1.100-canary.toml

      - name: Build API documentation
        run: cargo +1.100.0 doc --locked --no-deps --lib --config config/cargo-1.100-canary.toml

      - name: Verify raw x86_64 C ABI bool return register
        run: bash scripts/test-rust-ffi-bool.sh 1.100.0 1.100.0

      - name: Enforce Cargo.lock immutability
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- Cargo.lock
          test -z "$(git status --porcelain -- Cargo.lock)"
          echo "Cargo.lock unchanged." >> "$GITHUB_STEP_SUMMARY"

  rust-1-100-all-targets:
    name: Rust 1.100.0 complete example/test target surface
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install exact Rust 1.100.0
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Verify exact toolchain and compile all targets
        shell: bash
        run: |
          set -euo pipefail
          rustc +1.100.0 -Vv
          cargo +1.100.0 -Vv
          cargo +1.100.0 check --locked --all-targets --config config/cargo-1.100-canary.toml

      - name: Preserve lockfile identity
        run: git diff --exit-code -- Cargo.lock

  rust-1-101-beta:
    name: Rust 1.101.0-beta.1 forward-compatibility canary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_REGISTRY_GLOBAL_MIN_PUBLISH_AGE: 14 days
      CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE: deny
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact beta canary
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.101.0-beta.1 --profile minimal --component rustfmt --component clippy
          RUSTC_VERSION="$(rustup run 1.101.0-beta.1 rustc --version)"
          CARGO_VERSION="$(rustup run 1.101.0-beta.1 cargo --version)"
          [[ "$RUSTC_VERSION" == "rustc 1.101.0-beta.1 "* ]]
          [[ "$CARGO_VERSION" == "cargo 1.101.0-beta.1 "* ]]
          rustup run 1.101.0-beta.1 rustc -Vv
          rustup run 1.101.0-beta.1 cargo -Vv
      - name: Fetch locked dependencies with publication-age policy
        run: cargo +1.101.0-beta.1 fetch --locked --config config/cargo-1.100-canary.toml
      - name: Locked workspace metadata
        run: cargo +1.101.0-beta.1 metadata --locked --format-version 1 --no-deps --config config/cargo-1.100-canary.toml > /dev/null
      - name: Compile all targets
        run: cargo +1.101.0-beta.1 check --locked --all-targets --config config/cargo-1.100-canary.toml
      - name: Run all targets
        run: cargo +1.101.0-beta.1 test --locked --all-targets --config config/cargo-1.100-canary.toml
      - name: Run Clippy
        run: cargo +1.101.0-beta.1 clippy --locked --all-targets --config config/cargo-1.100-canary.toml
      - name: Build rustdoc
        run: cargo +1.101.0-beta.1 doc --locked --no-deps --config config/cargo-1.100-canary.toml
      - name: Verify raw x86_64 C ABI bool return register
        run: bash scripts/test-rust-ffi-bool.sh 1.101.0-beta.1 1.101.0-beta.1
      - name: Qualify stabilized never type across editions 2018, 2021 and 2024
        run: bash scripts/test-rust-1.100-language.sh 1.101.0-beta.1 1.101.0-beta.1
      - name: Exercise Cargo-native unused dependency lint
        run: bash scripts/test-cargo-1.100-lints.sh 1.101.0-beta.1 1.101.0-beta.1
      - name: Capture compiler artifacts through Cargo JSON messages
        run: bash scripts/capture-cargo-artifacts.sh 1.101.0-beta.1 "$RUNNER_TEMP/cargo-artifact-manifest"
      - name: Independently verify Cargo artifact passport
        run: bash scripts/verify-cargo-artifact-passport.sh "$RUNNER_TEMP/cargo-artifact-manifest" "$GITHUB_WORKSPACE"
      - name: Enforce Cargo.lock immutability
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- Cargo.lock
          test -z "$(git status --porcelain -- Cargo.lock)"

  rust-1-101-feature-smokes:
    name: Rust 1.101.0-beta.1 isolated Cargo feature and ABI smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact Rust and Cargo beta
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.101.0-beta.1 --profile minimal --component rustfmt
          RUSTC_VERSION="$(rustup run 1.101.0-beta.1 rustc --version)"
          CARGO_VERSION="$(rustup run 1.101.0-beta.1 cargo --version)"
          [[ "$RUSTC_VERSION" == "rustc 1.101.0-beta.1 "* ]]
          [[ "$CARGO_VERSION" == "cargo 1.101.0-beta.1 "* ]]
      - name: Verify raw x86_64 C ABI bool return register
        run: bash scripts/test-rust-ffi-bool.sh 1.101.0-beta.1 1.101.0-beta.1
      - name: Exercise Cargo-native unused dependency lint in isolated fixture
        run: bash scripts/test-cargo-1.100-lints.sh 1.101.0-beta.1 1.101.0-beta.1
      - name: Capture Cargo artifact manifest from isolated fixture
        run: bash scripts/capture-cargo-artifacts.sh 1.101.0-beta.1 "$RUNNER_TEMP/cargo-artifact-smokes" tests/toolchain/cargo-lints/Cargo.toml
      - name: Verify isolated fixture artifact passport
        run: bash scripts/verify-cargo-artifact-passport.sh "$RUNNER_TEMP/cargo-artifact-smokes" "$GITHUB_WORKSPACE"
      - name: Compile and self-test dependency-free paired benchmark analyzer
        env:
          RUSTC_TOOLCHAIN: 1.101.0-beta.1
        run: bash scripts/analyze-rust-toolchain-benchmark.sh --self-test
      - name: Exercise Cargo publish-age resolver under beta
        run: bash scripts/test-cargo-publish-age.sh 1.101.0-beta.1 1.101.0-beta.1

  rust-1-100-language-abi:
    name: Rust 1.100.0 language and ABI qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact stable and baseline compilers
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          rustup toolchain install 1.100.0 --profile minimal
          [[ "$(rustup run 1.99.1 rustc --version)" == "rustc 1.99.1 "* ]]
          [[ "$(rustup run 1.100.0 rustc --version)" == "rustc 1.100.0 "* ]]
          [[ "$(rustup run 1.100.0 cargo --version)" == "cargo 1.100.0 "* ]]
      - name: Verify raw x86_64 C ABI bool return register
        run: bash scripts/test-rust-ffi-bool.sh 1.100.0 1.100.0
      - name: Qualify stabilized never type across editions 2018, 2021 and 2024
        run: bash scripts/test-rust-1.100-language.sh 1.100.0 1.100.0
      - name: Verify the never-type fallback change against Rust 1.99.1
        run: bash scripts/test-rust-never-fallback-differential.sh 1.99.1 1.100.0

  rust-1-100-cargo-smokes:
    name: Rust 1.100.0 stable Cargo lint and artifact-interface tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact stable Cargo
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt
          [[ "$(rustup run 1.100.0 rustc --version)" == "rustc 1.100.0 "* ]]
          [[ "$(rustup run 1.100.0 cargo --version)" == "cargo 1.100.0 "* ]]
      - name: Exercise Cargo-native unused dependency lint
        run: bash scripts/test-cargo-1.100-lints.sh 1.100.0 1.100.0
      - name: Capture Cargo artifact manifest from isolated fixture
        run: bash scripts/capture-cargo-artifacts.sh 1.100.0 "$RUNNER_TEMP/cargo-artifact-smokes" tests/toolchain/cargo-lints/Cargo.toml
      - name: Verify isolated fixture artifact passport
        run: bash scripts/verify-cargo-artifact-passport.sh "$RUNNER_TEMP/cargo-artifact-smokes" "$GITHUB_WORKSPACE"
      - name: Compile and self-test dependency-free paired benchmark analyzer
        env:
          RUSTC_TOOLCHAIN: 1.100.0
        run: bash scripts/analyze-rust-toolchain-benchmark.sh --self-test

  cargo-publish-age-stable:
    name: Cargo 1.100.0 stable publish-age resolver negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact stable Cargo
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.100.0 --profile minimal
          rustup run 1.100.0 rustc -Vv
          rustup run 1.100.0 cargo -Vv
      - name: Exercise old-version fallback, fresh-only rejection and lockfile exception
        run: bash scripts/test-cargo-publish-age.sh 1.100.0 1.100.0

  cargo-publish-age-beta-negative-control:
    name: Cargo 1.101.0-beta.1 publish-age forward-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact beta Cargo
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.101.0-beta.1 --profile minimal
          rustup run 1.101.0-beta.1 rustc -Vv
          rustup run 1.101.0-beta.1 cargo -Vv
      - name: Exercise publish-age resolver controls without nightly feature flags
        run: bash scripts/test-cargo-publish-age.sh 1.101.0-beta.1 1.101.0-beta.1

  curvature-example-feature-contract:
    name: Curvature example feature contract (1.99.1, 1.100 stable, 1.101 beta)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.99.1", "1.100.0", "1.101.0-beta.1"]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ matrix.rust }}
      - name: Check feature-gated curvature examples
        run: |
          cargo +${{ matrix.rust }} check --locked --example curvature_selforg --features consciousness-curvature
          cargo +${{ matrix.rust }} check --locked --example curvature_lensing --features consciousness-curvature
