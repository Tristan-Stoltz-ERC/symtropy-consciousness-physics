name: Rust stable and forward-compatibility qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-toolchain-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-1-100-stable:
    name: Rust 1.100.0 stable release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify established Rust 1.99.1 baseline and raw ABI
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          STABLE_RUSTC="$(rustup run 1.99.1 rustc --version)"
          STABLE_CARGO="$(rustup run 1.99.1 cargo --version)"
          [[ "$STABLE_RUSTC" == "rustc 1.99.1 "* ]]
          [[ "$STABLE_CARGO" == "cargo 1.99.1 "* ]]
          rustup run 1.99.1 rustc -Vv
          rustup run 1.99.1 cargo -Vv
          bash scripts/test-rust-ffi-bool.sh 1.99.1
      - name: Discover currently published stable channel
        id: stable
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          RUSTC_VERSION="$(rustup run stable rustc --version)"
          CARGO_VERSION="$(rustup run stable cargo --version)"
          {
            echo "## Published stable toolchain"
            echo
            echo "- $RUSTC_VERSION"
            echo "- $CARGO_VERSION"
            echo "- commit $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rustc=$RUSTC_VERSION" >> "$GITHUB_OUTPUT"
          echo "cargo=$CARGO_VERSION" >> "$GITHUB_OUTPUT"
      - name: Attempt exact Rust 1.100.0 distribution installation independently of the stable alias
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/rust-1.100-install.log"
          set +e
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy > "$LOG" 2>&1
          status=$?
          set -e
          cat "$LOG"
          if [[ $status -ne 0 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Exact Rust 1.100.0 installation is not currently available from the distribution server."
            {
              echo "## Rust 1.100.0 exact distribution"
              echo
              echo "Installation failed with exit status $status."
              echo "Published stable alias reports: ${{ steps.stable.outputs.rustc }} / ${{ steps.stable.outputs.cargo }}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          RUSTC_VERSION="$(rustup run 1.100.0 rustc --version)"
          CARGO_VERSION="$(rustup run 1.100.0 cargo --version)"
          {
            echo "## Exact Rust 1.100.0 distribution"
            echo
            echo "- $RUSTC_VERSION"
            echo "- $CARGO_VERSION"
            echo "- commit $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$RUSTC_VERSION" == "rustc 1.100.0 "* && "$CARGO_VERSION" == "cargo 1.100.0 "* ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::The installed rustc/Cargo version does not exactly identify as 1.100.0."
          fi
      - name: Fetch existing lockfile under 14-day publication cooldown
        if: steps.candidate.outputs.ready == 'true'
        env:
          CARGO_REGISTRY_GLOBAL_MIN_PUBLISH_AGE: 14 days
          CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE: deny
        run: cargo +1.100.0 fetch --locked --config config/cargo-1.100-canary.toml
      - name: Locked workspace metadata
        if: steps.candidate.outputs.ready == 'true'
        run: cargo +1.100.0 metadata --locked --format-version 1 --no-deps --config config/cargo-1.100-canary.toml > /dev/null
      - name: Compile all targets
        if: steps.candidate.outputs.ready == 'true'
        run: cargo +1.100.0 check --locked --all-targets --config config/cargo-1.100-canary.toml
      - name: Run all targets
        if: steps.candidate.outputs.ready == 'true'
        run: cargo +1.100.0 test --locked --all-targets --config config/cargo-1.100-canary.toml
      - name: Run Clippy
        if: steps.candidate.outputs.ready == 'true'
        run: cargo +1.100.0 clippy --locked --all-targets --config config/cargo-1.100-canary.toml
      - name: Build rustdoc
        if: steps.candidate.outputs.ready == 'true'
        run: cargo +1.100.0 doc --locked --no-deps --config config/cargo-1.100-canary.toml
      - name: Verify raw x86_64 C ABI bool return register
        if: steps.candidate.outputs.ready == 'true'
        run: bash scripts/test-rust-ffi-bool.sh 1.100.0 1.100.0
      - name: Exercise Cargo-native unused dependency lint
        if: steps.candidate.outputs.ready == 'true'
        run: bash scripts/test-cargo-1.100-lints.sh 1.100.0 1.100.0
      - name: Capture compiler artifacts through Cargo JSON messages
        if: steps.candidate.outputs.ready == 'true'
        run: bash scripts/capture-cargo-artifacts.sh 1.100.0 "$RUNNER_TEMP/cargo-artifact-manifest"
      - name: Enforce Cargo.lock immutability
        if: steps.candidate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- Cargo.lock
          test -z "$(git status --porcelain -- Cargo.lock)"
          echo "Cargo.lock unchanged." >> "$GITHUB_STEP_SUMMARY"
      - name: Record release-not-yet-available status
        if: steps.candidate.outputs.ready != 'true'
        run: |
          {
            echo "## Rust 1.100.0 exact distribution: NOT AVAILABLE"
            echo
            echo "Published stable alias: ${{ steps.stable.outputs.rustc }} / ${{ steps.stable.outputs.cargo }}"
            echo "The exact version install failed or returned mismatched compiler/Cargo identity."
            echo "No 1.100.0 candidate tests were claimed."
          } >> "$GITHUB_STEP_SUMMARY"

  rust-1-101-beta:
    name: Rust 1.101.0-beta.1 forward-compatibility canary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_REGISTRY_GLOBAL_MIN_PUBLISH_AGE: 14 days
      CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE: deny
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact beta canary
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.101.0-beta.1 --profile minimal --component rustfmt --component clippy
          RUSTC_VERSION="$(rustup run 1.101.0-beta.1 rustc --version)"
          CARGO_VERSION="$(rustup run 1.101.0-beta.1 cargo --version)"
          [[ "$RUSTC_VERSION" == "rustc 1.101.0-beta.1 "* ]]
          [[ "$CARGO_VERSION" == "cargo 1.101.0-beta.1 "* ]]
          rustup run 1.101.0-beta.1 rustc -Vv
          rustup run 1.101.0-beta.1 cargo -Vv
      - name: Fetch locked dependencies with publication-age policy
        run: cargo +1.101.0-beta.1 fetch --locked --config config/cargo-1.100-canary.toml
      - name: Locked workspace metadata
        run: cargo +1.101.0-beta.1 metadata --locked --format-version 1 --no-deps --config config/cargo-1.100-canary.toml > /dev/null
      - name: Compile all targets
        run: cargo +1.101.0-beta.1 check --locked --all-targets --config config/cargo-1.100-canary.toml
      - name: Run all targets
        run: cargo +1.101.0-beta.1 test --locked --all-targets --config config/cargo-1.100-canary.toml
      - name: Run Clippy
        run: cargo +1.101.0-beta.1 clippy --locked --all-targets --config config/cargo-1.100-canary.toml
      - name: Build rustdoc
        run: cargo +1.101.0-beta.1 doc --locked --no-deps --config config/cargo-1.100-canary.toml
      - name: Verify raw x86_64 C ABI bool return register
        run: bash scripts/test-rust-ffi-bool.sh 1.101.0-beta.1 1.101.0-beta.1
      - name: Exercise Cargo-native unused dependency lint
        run: bash scripts/test-cargo-1.100-lints.sh 1.101.0-beta.1 1.101.0-beta.1
      - name: Capture compiler artifacts through Cargo JSON messages
        run: bash scripts/capture-cargo-artifacts.sh 1.101.0-beta.1 "$RUNNER_TEMP/cargo-artifact-manifest"
      - name: Enforce Cargo.lock immutability
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- Cargo.lock
          test -z "$(git status --porcelain -- Cargo.lock)"

  rust-1-101-feature-smokes:
    name: Rust 1.101.0-beta.1 isolated Cargo feature and ABI smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact Rust and Cargo beta
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.101.0-beta.1 --profile minimal --component rustfmt
          RUSTC_VERSION="$(rustup run 1.101.0-beta.1 rustc --version)"
          CARGO_VERSION="$(rustup run 1.101.0-beta.1 cargo --version)"
          [[ "$RUSTC_VERSION" == "rustc 1.101.0-beta.1 "* ]]
          [[ "$CARGO_VERSION" == "cargo 1.101.0-beta.1 "* ]]
      - name: Verify raw x86_64 C ABI bool return register
        run: bash scripts/test-rust-ffi-bool.sh 1.101.0-beta.1 1.101.0-beta.1
      - name: Exercise Cargo-native unused dependency lint in isolated fixture
        run: bash scripts/test-cargo-1.100-lints.sh 1.101.0-beta.1 1.101.0-beta.1
      - name: Capture Cargo artifact manifest from isolated fixture
        run: bash scripts/capture-cargo-artifacts.sh 1.101.0-beta.1 "$RUNNER_TEMP/cargo-artifact-smokes" tests/toolchain/cargo-lints/Cargo.toml
