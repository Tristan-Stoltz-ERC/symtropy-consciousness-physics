name: CRN uncertainty guard qualification

on:
  pull_request:
    branches: [research/crn-event-family-portfolio-v0.1]
    paths:
      - 'Cargo.toml'
      - 'examples/event_rng_crn_uncertainty_guard.rs'
      - 'docs/research/CRN_UNCERTAINTY_GUARD_V0_1.md'
      - 'docs/research/contracts/crn-uncertainty-guard.v0.1.json'
      - '.github/workflows/crn-uncertainty-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Rust ${{ matrix.toolchain }} — guard and holdout benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.99.1', '1.100.0', '1.101.0-beta.1']
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install and identify exact Rust/Cargo
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt
          rustc "+$TOOLCHAIN" -vV
          cargo "+$TOOLCHAIN" -Vv
          rustc "+$TOOLCHAIN" --version | grep -F "rustc $TOOLCHAIN"

      - name: Format new benchmark source
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustfmt "+$TOOLCHAIN" --check examples/event_rng_crn_uncertainty_guard.rs

      - name: Run guard unit tests
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo "+$TOOLCHAIN" test --locked --example event_rng_crn_uncertainty_guard

      - name: Execute disjoint-seed training and holdout benchmark
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          set -euo pipefail
          cargo "+$TOOLCHAIN" run --locked --example event_rng_crn_uncertainty_guard | tee "$RUNNER_TEMP/crn-guard.txt"

      - name: Validate machine-readable receipts and frozen decision contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/crn-guard.txt" docs/research/contracts/crn-uncertainty-guard.v0.1.json <<'PY'
          import json
          import pathlib
          import sys

          output = pathlib.Path(sys.argv[1]).read_text().splitlines()
          contract = json.loads(pathlib.Path(sys.argv[2]).read_text())
          records = [json.loads(line.split('=', 1)[1]) for line in output if line.startswith('CRN_GUARD_JSON=')]
          assert len(records) == len(contract['cases']) == 4, (len(records), len(contract['cases']))
          assert 'benchmark_status=PASS' in output
          for record in records:
              assert record['schema'] == contract['schema']
              assert record['train_replicates'] == contract['train_replicates']
              assert record['holdout_replicates'] == contract['holdout_replicates']
              assert record['subjects_per_replicate'] == contract['subjects_per_replicate']
              assert record['covariance_deadband'] == contract['decision']['covariance_deadband']
              assert record['pass'] is True
              for family in ('u', 'v'):
                  lower, upper = record[f'family_{family}_ci99']
                  decision = record[f'family_{family}_guard']
                  assert lower <= upper
                  expected = 'SHARED' if lower > 0.001 else ('INDEPENDENT' if upper < -0.001 else 'ABSTAIN_TO_INDEPENDENT')
                  assert decision == expected, (family, lower, upper, decision, expected)
              assert record['variance_ratio_guard_selector'] >= 0.0
              lower, upper = record['guard_variance_ratio_ci95']
              assert lower <= upper
          print('PASS: four machine-readable cases match the frozen uncertainty/deadband contract')
          PY
