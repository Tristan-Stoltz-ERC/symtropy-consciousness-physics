name: Rust 1.99.1 vs 1.100.0 application benchmark

on:
  pull_request:
    paths:
      - "benchmarks/rust-toolchain/**"
      - "scripts/benchmark-rust-1.99.1-vs-1.100.0.sh"
      - "scripts/analyze-rust-toolchain-benchmark.sh"
      - ".github/workflows/rust-1-99-1-vs-1-100-0-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer qualification commit must not cancel an in-progress benchmark.
# One pending benchmark per PR/ref is enough; keep a running measurement intact.
concurrency:
  group: rust-compiler-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired-benchmark:
    name: Paired compiler and simulation benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BUILD_REPEATS: "5"
      RUNTIME_REPEATS: "5"
      RESULT_ROOT: benchmark-results/rust-toolchain
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install exact toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.99.1 --profile minimal
          rustup toolchain install 1.100.0 --profile minimal
          [[ "$(rustup run 1.99.1 rustc --version)" == "rustc 1.99.1 "* ]]
          [[ "$(rustup run 1.100.0 rustc --version)" == "rustc 1.100.0 "* ]]
          [[ "$(rustup run 1.99.1 cargo --version)" == "cargo 1.99.1 "* ]]
          [[ "$(rustup run 1.100.0 cargo --version)" == "cargo 1.100.0 "* ]]
          rustup run 1.99.1 rustc -Vv
          rustup run 1.99.1 cargo -Vv
          rustup run 1.100.0 rustc -Vv
          rustup run 1.100.0 cargo -Vv

      - name: Run five paired fresh-target trials with Cargo timing reports
        id: measure
        run: bash scripts/benchmark-rust-1.99.1-vs-1.100.0.sh

      - name: Analyse paired results with deterministic bootstrap
        id: analyze
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t csv_files < <(find "$RESULT_ROOT" -type f -name measurements.csv -print | sort)
          [[ "${#csv_files[@]}" -eq 1 ]] || {
            echo "Expected exactly one benchmark measurements.csv; found ${#csv_files[@]}" >&2
            exit 1
          }
          CSV="${csv_files[0]}"
          OUT="$(dirname "$(dirname "$CSV")")"
          echo "BENCHMARK_OUT=$OUT" >> "$GITHUB_ENV"
          mkdir -p "$OUT/results"
          {
            echo "# Rust 1.99.1 vs 1.100.0 — paired benchmark analysis"
            echo
            echo "- Commit: $(git rev-parse HEAD)"
            echo "- Cargo.lock SHA-256: $(sha256sum Cargo.lock | awk '{print $1}')"
            echo "- Toolchains: exact 1.99.1 and 1.100.0"
            echo "- Trials: $BUILD_REPEATS paired builds, $RUNTIME_REPEATS runtimes per trial"
            echo "- Cargo --timings: one HTML critical-path report per clean target build"
            echo
            RUSTC_TOOLCHAIN=1.100.0 bash scripts/analyze-rust-toolchain-benchmark.sh "$CSV" 1.99.1 1.100.0
          } | tee "$OUT/results/analysis.md" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify source and dependency lock are unchanged
        if: always() && steps.measure.outcome == 'success'
        run: |
          set -euo pipefail
          git diff --exit-code -- Cargo.lock
          test -z "$(git status --porcelain -- Cargo.lock)"

      - name: Record benchmark disposition for evidence retention
        if: always()
        shell: bash
        env:
          MEASUREMENT_OUTCOME: ${{ steps.measure.outcome }}
          ANALYSIS_OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_ROOT"
          {
            echo "schema=luminous.rust-toolchain-benchmark-job.v0.1"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "measurement_outcome=$MEASUREMENT_OUTCOME"
            echo "analysis_outcome=$ANALYSIS_OUTCOME"
            echo "artifact_policy=upload_raw_measurements_even_when_analysis_rejects"
          } > "$RESULT_ROOT/job-disposition.txt"

      - name: Upload reproducible raw evidence (including rejected runs)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rust-1.99.1-vs-1.100.0-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            benchmark-results/rust-toolchain/job-disposition.txt
            benchmark-results/rust-toolchain/run-*/STATUS.txt
            benchmark-results/rust-toolchain/run-*/metadata.txt
            benchmark-results/rust-toolchain/run-*/toolchains
            benchmark-results/rust-toolchain/run-*/logs
            benchmark-results/rust-toolchain/run-*/results
          if-no-files-found: warn
          retention-days: 30
