name: Rust 1.99.1 vs 1.100.0 application benchmark

on:
  pull_request:
    paths:
      - "benchmarks/rust-toolchain/**"
      - "scripts/benchmark-rust-1.99.1-vs-1.100.0.sh"
      - "scripts/analyze-rust-toolchain-benchmark.sh"
      - "scripts/rust-1.99.1-vs-1.100.0-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-compiler-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-benchmark:
    name: Paired compiler and simulation benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BUILD_REPEATS: "5"
      RUNTIME_REPEATS: "5"
      RESULT_ROOT: benchmark-results/rust-toolchain
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install exact toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.99.1 --profile minimal
          rustup toolchain install 1.100.0 --profile minimal
          [[ "$(rustup run 1.99.1 rustc --version)" == "rustc 1.99.1 "* ]]
          [[ "$(rustup run 1.100.0 rustc --version)" == "rustc 1.100.0 "* ]]
          [[ "$(rustup run 1.99.1 cargo --version)" == "cargo 1.99.1 "* ]]
          [[ "$(rustup run 1.100.0 cargo --version)" == "cargo 1.100.0 "* ]]
          rustup run 1.99.1 rustc -Vv
          rustup run 1.99.1 cargo -Vv
          rustup run 1.100.0 rustc -Vv
          rustup run 1.100.0 cargo -Vv

      - name: Run five paired fresh-target trials
        run: bash scripts/benchmark-rust-1.99.1-vs-1.100.0.sh

      - name: Analyse paired results with deterministic bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t csv_files < <(find "$RESULT_ROOT" -type f -name measurements.csv -print | sort)
          [[ "${#csv_files[@]}" -eq 1 ]] || {
            echo "Expected exactly one benchmark measurements.csv; found ${#csv_files[@]}" >&2
            exit 1
          }
          CSV="${csv_files[0]}"
          OUT="$(dirname "$(dirname "$CSV")")"
          echo "BENCHMARK_OUT=$OUT" >> "$GITHUB_ENV"
          mkdir -p "$OUT/results"
          {
            echo "# Rust 1.99.1 vs 1.100.0 — paired benchmark analysis"
            echo
            echo "- Commit: $(git rev-parse HEAD)"
            echo "- Cargo.lock SHA-256: $(sha256sum Cargo.lock | awk '{print $1}')"
            echo "- Toolchains: exact 1.99.1 and 1.100.0"
            echo "- Trials: $BUILD_REPEATS paired builds, $RUNTIME_REPEATS runtimes per trial"
            echo
            RUSTC_TOOLCHAIN=1.100.0 bash scripts/analyze-rust-toolchain-benchmark.sh "$CSV" 1.99.1 1.100.0
          } | tee "$OUT/results/analysis.md" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify source and dependency lock are unchanged
        run: |
          set -euo pipefail
          git diff --exit-code -- Cargo.lock
          test -z "$(git status --porcelain -- Cargo.lock)"

      - name: Upload reproducible raw evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rust-1.99.1-vs-1.100.0-${{ github.sha }}
          path: |
            ${{ env.BENCHMARK_OUT }}/metadata.txt
            ${{ env.BENCHMARK_OUT }}/toolchains
            ${{ env.BENCHMARK_OUT }}/logs
            ${{ env.BENCHMARK_OUT }}/results
          if-no-files-found: error
          retention-days: 30
