name: Deterministic floating-point reduction qualification

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'src/coupling.rs'
      - 'examples/cooperation_decomposition.rs'
      - 'docs/research/DETERMINISTIC_REDUCTIONS_V0_1.md'
      - '.github/workflows/deterministic-reduction-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Rust ${{ matrix.toolchain }} — deterministic reductions
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.99.1', '1.100.0', '1.101.0-beta.1']
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install exact toolchain
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt
          rustc "+$TOOLCHAIN" -vV
          cargo "+$TOOLCHAIN" -Vv
          rustc "+$TOOLCHAIN" --version | grep -F "rustc $TOOLCHAIN"

      - name: Check formatting
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustfmt "+$TOOLCHAIN" --check src/coupling.rs

      - name: Run historical/default library tests
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo "+$TOOLCHAIN" test --locked --lib

      - name: Run opt-in deterministic-reduction regression tests
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo "+$TOOLCHAIN" test --locked --lib --features deterministic-reductions

      - name: Build exact cooperation-decomposition candidate
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo "+$TOOLCHAIN" build --locked --release --features deterministic-reductions --example cooperation_decomposition

      - name: Execute one binary in five fresh processes and compare stdout
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/deterministic-reduction/$TOOLCHAIN"
          mkdir -p "$out"
          binary="target/release/examples/cooperation_decomposition"
          test -x "$binary"
          for trial in 1 2 3 4 5; do
            "$binary" > "$out/run-$trial.stdout" 2> "$out/run-$trial.stderr"
            sha256sum "$out/run-$trial.stdout" | tee -a "$out/stdout-sha256.txt"
          done
          for trial in 2 3 4 5; do
            cmp "$out/run-1.stdout" "$out/run-$trial.stdout"
          done
          {
            echo "schema=luminous.symtropy.deterministic-reduction-receipt.v0.1"
            echo "toolchain=$TOOLCHAIN"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "feature=deterministic-reductions"
            echo "fresh_process_runs=5"
            echo "stdout_byte_identical=true"
            echo "binary_sha256=$(sha256sum "$binary" | awk '{print $1}')"
          } > "$out/receipt.txt"
          cat "$out/receipt.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw determinism evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deterministic-reductions-${{ matrix.toolchain }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/deterministic-reduction
          if-no-files-found: warn
          retention-days: 30

      - name: Verify Cargo.lock unchanged
        if: always()
        run: git diff --exit-code -- Cargo.lock
