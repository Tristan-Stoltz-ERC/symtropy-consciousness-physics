name: Rust 1.100 PGO evidence qualification
on:
  workflow_dispatch:
    inputs:
      train_example:
        description: Frozen example used to generate the profile
        type: choice
        options:
          - jphi_convergence
          - gradient_replacement
          - cooperation_decomposition
        default: jphi_convergence
        required: true
      repeats:
        description: Exploratory matched runtime repetitions (5 minimum for exploration)
        type: choice
        options: ["3", "5", "10"]
        default: "3"
        required: true

permissions:
  contents: read

concurrency:
  group: rust-100-pgo-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  instrumentation-pgo:
    name: Instrumentation PGO / exact output equivalence
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install exact Rust/Cargo and LLVM profile tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.100.0 --profile minimal
          rustup component add llvm-tools-preview --toolchain 1.100.0
          [[ "$(rustup run 1.100.0 rustc --version)" == "rustc 1.100.0 "* ]]
          [[ "$(rustup run 1.100.0 cargo --version)" == "cargo 1.100.0 "* ]]
          rustup run 1.100.0 rustc -Vv
          rustup run 1.100.0 cargo -Vv

      - name: Run instrumentation PGO profile tournament
        id: pgo
        env:
          RUST_TOOLCHAIN: 1.100.0
          PGO_TRAIN_EXAMPLE: ${{ inputs.train_example }}
          PGO_RUN_REPEATS: ${{ inputs.repeats }}
          PGO_RESULT_ROOT: ${{ runner.temp }}/symtropy-pgo
        run: |
          set -euo pipefail
          bash scripts/run-rust-pgo-instrumented.sh
          RESULT_DIR="$(find "$PGO_RESULT_ROOT" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$RESULT_DIR"
          echo "result_dir=$RESULT_DIR" >> "$GITHUB_OUTPUT"

      - name: Analyze exploratory paired runtime measurements
        if: success()
        env:
          RUSTC_TOOLCHAIN: 1.100.0
        run: |
          set -euo pipefail
          CSV="$(find "${{ runner.temp }}/symtropy-pgo" -name runtime.csv -print -quit)"
          test -n "$CSV"
          bash scripts/analyze-rust-toolchain-benchmark.sh "$CSV" no-pgo instrumentation-pgo

      - name: Upload raw PGO profile and evidence
        if: always()
        uses: actions/upload-artifact@ea8e3b7ca1d6e9d2cbbab18e4f219d6f1b7c2d69
        with:
          name: rust-1.100-instrumentation-pgo-${{ github.sha }}
          path: ${{ runner.temp }}/symtropy-pgo/
          if-no-files-found: warn
          retention-days: 30
