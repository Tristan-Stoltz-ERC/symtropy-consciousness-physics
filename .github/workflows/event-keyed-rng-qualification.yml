name: Event-keyed RNG qualification

on:
  pull_request:
    paths:
      - "src/event_rng.rs"
      - "src/event_alignment.rs"
      - "src/event_identity.rs"
      - "src/event_lineage.rs"
      - "src/event_lineage_receipt.rs"
      - "src/lib.rs"
      - "Cargo.toml"
      - "examples/event_rng_crn_variance.rs"
      - "examples/event_rng_throughput.rs"
      - "examples/event_rng_reference_corpus.rs"
      - "examples/event_rng_portability_vectors.rs"
      - "tests/reference/event-rng-portability-v1.txt"
      - "tests/reference/philox4x64_random123.cpp"
      - "scripts/test-philox-random123-parity.sh"
      - "Cargo.toml"
      - "docs/research/EVENT_KEYED_RNG_IMPLEMENTATION_V0_1.md"
      - "docs/research/EVENT_RNG_CRN_VARIANCE_BENCHMARK_V0_1.md"
      - "docs/research/EVENT_IDENTITY_AND_LINEAGE_POLICY_V0_1.md"
      - "docs/research/EVENT_KEYED_RNG_SOTA_QUALIFICATION_V0_1.md"
      - "docs/research/EVENT_IDENTITY_CLAIM_AUDIT_V0_1.md"
      - "docs/research/EVENT_DYNAMIC_ENTITY_LINEAGE_V0_1.md"
      - "docs/research/DYNAMIC_ENTITY_LINEAGE_RECEIPTS_V0_1.md"
      - "docs/research/EVENT_RNG_NATIVE_ARM64_PARITY_V0_1.md"
      - "docs/research/EVENT_RNG_THROUGHPUT_BENCHMARK_V0_1.md"
      - "docs/research/EVENT_RNG_RANDOM123_REFERENCE_PARITY_V0_1.md"
      - "benchmarks/event-rng/implementation-contract-v0.1.json"
      - "benchmarks/event-rng/crn-variance-contract-v0.1.json"
      - "benchmarks/event-rng/event-identity-lineage-contract-v0.1.json"
      - "benchmarks/event-rng/sota-qualification-contract-v0.1.json"
      - "benchmarks/event-rng/event-identity-claim-contract-v0.1.json"
      - "benchmarks/event-rng/dynamic-entity-lineage-contract-v0.1.json"
      - "benchmarks/event-rng/lineage-receipt-contract-v0.1.json"
      - "benchmarks/event-rng/native-architecture-parity-contract-v0.1.json"
      - "benchmarks/event-rng/throughput-contract-v0.1.json"
      - "benchmarks/event-rng/reference-parity-contract-v0.1.json"
      - ".github/workflows/event-keyed-rng-qualification.yml"

permissions:
  contents: read

concurrency:
  group: event-keyed-rng-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate the machine-readable contract
        run: |
          set -euo pipefail
          jq -e '.schema == "luminous.symtropy.event-keyed-rng-implementation.v0.1"' \
            benchmarks/event-rng/implementation-contract-v0.1.json
          jq -e '.schema == "luminous.symtropy.crn-variance-benchmark.v0.1"' \
            benchmarks/event-rng/crn-variance-contract-v0.1.json
          jq -e '.schema == "luminous.symtropy.event-identity-lineage-policy.v0.1"' \
            benchmarks/event-rng/event-identity-lineage-contract-v0.1.json
          jq -e '.schema == "luminous.symtropy.event-keyed-rng-sota-qualification.v0.1"' \
            benchmarks/event-rng/sota-qualification-contract-v0.1.json
          jq -e '.schema == "luminous.symtropy.event-identity-claim-audit.v0.1"' \
            benchmarks/event-rng/event-identity-claim-contract-v0.1.json
          jq -e '.schema == "luminous.symtropy.dynamic-entity-lineage.v0.1"' \
            benchmarks/event-rng/dynamic-entity-lineage-contract-v0.1.json
          jq -e '.schema == "luminous.dynamic-entity-lineage-receipt.v1"' \
            benchmarks/event-rng/lineage-receipt-contract-v0.1.json
          jq -e '.schema == "luminous.symtropy.event-rng-native-architecture-parity.v0.1"' \
            benchmarks/event-rng/native-architecture-parity-contract-v0.1.json
          grep -F 'schema=luminous.symtropy.event-rng-portability.v1' tests/reference/event-rng-portability-v1.txt
          grep -F 'receipt_round_trips_to_one_canonical_byte_representation' src/event_lineage_receipt.rs
          jq -e '.schema == "luminous.symtropy.event-rng-throughput.v0.1"' \
            benchmarks/event-rng/throughput-contract-v0.1.json
          grep -F 'event_address_cached_uniform_stream' examples/event_rng_throughput.rs
          grep -F 'benchmark_status=MEASURED_NO_WINNER_DECLARED' examples/event_rng_throughput.rs
          jq -e '.schema == "luminous.symtropy.random123-philox-parity.v0.1"' \
            benchmarks/event-rng/reference-parity-contract-v0.1.json
          bash -n scripts/test-philox-random123-parity.sh
          grep -F 'pub const EVENT_KEY_SCHEMA_VERSION: u32 = 1;' src/event_rng.rs
          grep -F 'pub const EVENT_RNG_ALGORITHM: &str = "philox4x64-10";' src/event_rng.rs
          grep -F 'philox4x64_10_matches_random123_mixed_known_answer_vector' src/event_rng.rs
          grep -F 'legacy_lcg_unchanged' benchmarks/event-rng/implementation-contract-v0.1.json
          grep -F 'benchmark_status=PASS' examples/event_rng_crn_variance.rs

  exact-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.99.1", "1.100.0", "1.101.0-beta.1"]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact compiler and Cargo
        shell: bash
        env:
          RUST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup run "$RUST_TOOLCHAIN" rustc -Vv
          rustup run "$RUST_TOOLCHAIN" cargo -Vv
          rustup run "$RUST_TOOLCHAIN" rustfmt --version
      - name: Format RNG module and CRN benchmark
        env:
          RUST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup run "$RUST_TOOLCHAIN" rustfmt --edition 2021 --check src/event_rng.rs src/event_alignment.rs src/event_identity.rs src/event_lineage.rs src/event_lineage_receipt.rs examples/event_rng_crn_variance.rs examples/event_rng_throughput.rs examples/event_rng_reference_corpus.rs examples/event_rng_portability_vectors.rs
      - name: Verify architecture-independent portability bytes
        env:
          RUST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          set -euo pipefail
          rustup run "$RUST_TOOLCHAIN" cargo run --locked --example event_rng_portability_vectors > "$RUNNER_TEMP/event-rng-portability.txt"
          cmp --silent tests/reference/event-rng-portability-v1.txt "$RUNNER_TEMP/event-rng-portability.txt"
          sha256sum "$RUNNER_TEMP/event-rng-portability.txt"
      - name: Run reference vectors and event-address adversarial tests
        env:
          RUST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo +"$RUST_TOOLCHAIN" test --locked --lib event_rng::tests
      - name: Run canonical lineage receipt and reconciliation tests
        env:
          RUST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo +"$RUST_TOOLCHAIN" test --locked --lib event_lineage_receipt::tests
      - name: Run dynamic entity lineage and collision registry tests
        env:
          RUST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo +"$RUST_TOOLCHAIN" test --locked --lib event_lineage::tests
      - name: Run semantic event identity claim audit tests
        env:
          RUST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo +"$RUST_TOOLCHAIN" test --locked --lib event_identity::tests
      - name: Run analytical CRN variance and negative-covariance control
        env:
          RUST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo +"$RUST_TOOLCHAIN" run --locked --example event_rng_crn_variance
      - name: Differential-test Rust Philox against pinned Random123 C++ reference
        env:
          RUST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: bash scripts/test-philox-random123-parity.sh "$RUST_TOOLCHAIN" 2048
      - name: Run layered event RNG throughput smoke benchmark
        env:
          RUST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo +"$RUST_TOOLCHAIN" run --release --locked --example event_rng_throughput -- 50000
      - name: Compile the library surface
        env:
          RUST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo +"$RUST_TOOLCHAIN" check --locked --lib
      - name: Preserve dependency graph
        run: git diff --exit-code -- Cargo.lock


  native-aarch64-portability:
    name: Native AArch64 portability (Rust 1.100.0)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact stable compiler and verify native architecture
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt
          [[ "$(uname -m)" == "aarch64" ]]
          [[ "$(rustup run 1.100.0 rustc --version)" == "rustc 1.100.0 "* ]]
          [[ "$(rustup run 1.100.0 cargo --version)" == "cargo 1.100.0 "* ]]
          rustup run 1.100.0 rustc -Vv
      - name: Verify byte-for-byte portability corpus natively on AArch64
        run: |
          set -euo pipefail
          rustup run 1.100.0 cargo run --locked --example event_rng_portability_vectors > "$RUNNER_TEMP/event-rng-portability.txt"
          cmp --silent tests/reference/event-rng-portability-v1.txt "$RUNNER_TEMP/event-rng-portability.txt"
          sha256sum "$RUNNER_TEMP/event-rng-portability.txt"
      - name: Run Philox reference tests on AArch64
        run: cargo +1.100.0 test --locked --lib event_rng::tests
      - name: Run dynamic lineage and receipt tests on AArch64
        run: |
          set -euo pipefail
          cargo +1.100.0 test --locked --lib event_lineage::tests
          cargo +1.100.0 test --locked --lib event_lineage_receipt::tests
      - name: Run semantic identity and alignment tests on AArch64
        run: |
          set -euo pipefail
          cargo +1.100.0 test --locked --lib event_identity::tests
          cargo +1.100.0 test --locked --lib event_alignment::tests
      - name: Preserve dependency graph
        run: git diff --exit-code -- Cargo.lock
