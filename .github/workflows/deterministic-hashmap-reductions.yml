name: Deterministic HashMap reduction qualification

on:
  pull_request:
    branches: [research/cargo-artifact-passport-v0.1]
    paths:
      - 'Cargo.toml'
      - 'src/coupling.rs'
      - 'scripts/verify-cooperation-decomposition-determinism.sh'
      - 'docs/research/DETERMINISTIC_REDUCTIONS_V0_1.md'
      - 'docs/research/contracts/deterministic-reductions.v0.1.json'
      - '.github/workflows/deterministic-hashmap-reductions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Rust ${{ matrix.toolchain }} — deterministic reductions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.99.1', '1.100.0', '1.101.0-beta.1']
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install exact Rust toolchain and rustfmt
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
          rustc -vV
          cargo -Vv
          rustc --version | grep -F "rustc $RUSTUP_TOOLCHAIN"

      - name: Check Rust formatting
        run: rustfmt --check src/coupling.rs

      - name: Validate historical default feature behavior
        run: cargo test --locked --lib

      - name: Run deterministic-reduction adversarial tests
        run: cargo test --locked --lib --features deterministic-reductions

      - name: Validate replay-probe shell syntax
        run: bash -n scripts/verify-cooperation-decomposition-determinism.sh

      - name: Compare legacy and deterministic fresh-process output
        shell: bash
        env:
          REPEATS: "5"
          SEED_START_INDEX: "0"
          SEED_COUNT: "2"
          KEEP_RESULTS: "1"
          TMPDIR: ${{ runner.temp }}
        run: bash scripts/verify-cooperation-decomposition-determinism.sh

      - name: Upload raw determinism evidence (including failures)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cooperation-determinism-${{ matrix.toolchain }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/cooperation-determinism.*/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify exact source and lockfile remained unchanged
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code -- Cargo.lock
          test -z "$(git status --porcelain -- Cargo.lock)"
