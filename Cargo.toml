[package]
name = "symtropy-consciousness-physics"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "By-product mutualism in energy-constrained multi-agent systems. 55 findings, 65 experiments."
repository = "https://github.com/Tristan-Stoltz-ERC/symtropy-consciousness-physics"

[dependencies]
symtropy-math = { path = "crates/symtropy-math" }
symtropy-physics = { path = "crates/symtropy-physics" }
symthaea-consciousness-equation = { path = "crates/symthaea-consciousness-equation" }
symthaea-core = { version = "=0.5.1", default-features = false, optional = true }
nalgebra = "0.34"

[features]
default = []
consciousness-curvature = []
consciousness-hdc = ["dep:symthaea-core"]

[dev-dependencies]
proptest = "1.4"

# This experiment consumes the curvature API, which is deliberately compiled
# only when the consciousness-curvature feature is enabled.
[[example]]
name = "curvature_selforg"
path = "examples/curvature_selforg.rs"
required-features = ["consciousness-curvature"]

# HDC/LTC integration example: reuse the canonical Symthaea core implementation.
[[example]]
name = "hdc_cooperation"
path = "examples/hdc_cooperation.rs"
required-features = ["consciousness-hdc"]
