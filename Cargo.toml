[package]
name = "symtropy-consciousness-physics"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "By-product mutualism in energy-constrained multi-agent systems. 55 findings, 65 experiments."
repository = "https://github.com/Tristan-Stoltz-ERC/symtropy-consciousness-physics"

[dependencies]
symtropy-math = { path = "crates/symtropy-math" }
symtropy-physics = { path = "crates/symtropy-physics" }
symthaea-consciousness-equation = { path = "crates/symthaea-consciousness-equation" }
nalgebra = "0.34"

[features]
default = []
consciousness-curvature = []

[dev-dependencies]
proptest = "1.4"

# This experiment consumes the curvature API, which is deliberately compiled
# only when the consciousness-curvature feature is enabled.
[[example]]
name = "curvature_selforg"
path = "examples/curvature_selforg.rs"
required-features = ["consciousness-curvature"]

# The lensing experiment requires the feature-gated conformal metric and
# HarmonyField::sigma_gradient API. Do not compile it in the default target set.
[[example]]
name = "curvature_lensing"
path = "examples/curvature_lensing.rs"
required-features = ["consciousness-curvature"]


# Analytical counterfactual variance benchmark for the event-keyed RNG.
[[example]]
name = "event_rng_crn_variance"
path = "examples/event_rng_crn_variance.rs"

# Layered raw generator, event-address, and historical LCG microbenchmark.
[[example]]
name = "event_rng_throughput"
path = "examples/event_rng_throughput.rs"

# Deterministic corpus generator for pinned Random123 Philox parity.
[[example]]
name = "event_rng_reference_corpus"
path = "examples/event_rng_reference_corpus.rs"

# Cross-fitted CRN policy selection on disjoint training and holdout seeds.
[[example]]
name = "event_rng_crn_crossfit"
path = "examples/event_rng_crn_crossfit.rs"

# Event-family-specific cross-fitted CRN coupling portfolio benchmark.
[[example]]
name = "event_rng_crn_event_family_portfolio"
path = "examples/event_rng_crn_event_family_portfolio.rs"
